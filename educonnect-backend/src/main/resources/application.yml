server:
  port: 8081

spring:
  profiles:
    active: dev

  application:
    name: educonnect-backend

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:changeme_in_production_use_a_long_random_string}
    expiration: 86400000        # 24h en ms
    refresh-expiration: 604800000  # 7j en ms

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/educonnect_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:firas123}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

logging:
  level:
    com.educonnect: DEBUG
    org.springframework.security: DEBUG
